# Computer helpers for Windows, Linux and the agent's own sandboxed desktop
# (docs/reports/computer-use-windows-linux-2026-10-26.md). The macOS helper
# is Swift, in ../computer-helper; both speak the protocol declared in
# packages/contracts ("Computers") and share its JSON fixtures.
[workspace]
resolver = "3"
members = ["crates/core", "crates/client"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
rand = "0.9"
ureq = { version = "3", features = ["json", "cookies"] }
tiny_http = "0.12"
