[package]
name = "computer-x11"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The X11 backend: the agent's own sandboxed desktop, and Linux X11 sessions. AT-SPI for the element tree, XTest for input, GetImage for screenshots."

[[bin]]
name = "computer-helper-x11"
path = "src/main.rs"

[dependencies]
computer-core = { path = "../core" }
computer-client = { path = "../client" }
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
image.workspace = true
x11rb = { version = "0.14", features = ["xtest"] }
atspi = "0.30"
zbus = { version = "5", default-features = false, features = ["async-io"] }
async-io = "2"
