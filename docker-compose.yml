# MikeOSS — full local stack, one `docker compose up`. No external accounts.
# Postgres for data, GoTrue for auth, RustFS for storage.
# The only thing you must supply is one model API key in backend/.env.
#
# The JWT secret and the service-role key below are well-known local demo
# values — fine for localhost, NOT for anything exposed. The key is a JWT
# signed with the secret; don't change one without regenerating the other.

services:
  # --- Postgres: application tables, chat transcripts, and GoTrue's auth schema.
  # docker/db-init/roles.sql gives GoTrue its role and schema on first start.
  db:
    image: postgres:17.6
    ports:
      # ponytail: infra ports bind loopback only — reachable from the host for
      # debugging, never from the internet. Compose networking is unaffected, so
      # the other services still reach these by service name.
      - "127.0.0.1:${DB_PORT:-54322}:5432" # psql from host if needed
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db-init/roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # --- Auth (GoTrue). Auto-runs its migrations to build auth.users.
  auth:
    image: supabase/gotrue:v2.189.0
    ports:
      # Public: confirmation links, password resets and OAuth callbacks send
      # the browser here.
      - "${AUTH_PORT:-54321}:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      # Must be the browser-reachable URL of this service — confirmation links
      # are built from it, so a localhost value makes signup uncompletable
      # off-machine.
      API_EXTERNAL_URL: ${AUTH_PUBLIC_URL:-http://localhost:54321}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://gotrue:postgres@db:5432/postgres
      GOTRUE_SITE_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: "*"
      GOTRUE_JWT_SECRET: mike-local-gotrue-jwt-secret-not-for-production
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_PASSWORD_MIN_LENGTH: "10"
      # Open registration by default (localhost). On a public host, create your
      # account then set GOTRUE_DISABLE_SIGNUP=true to pull the ladder up.
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-false}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOTRUE_EXTERNAL_GOOGLE_ENABLED:-true}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOTRUE_EXTERNAL_GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${AUTH_PUBLIC_URL:-http://localhost:54321}/callback
      # Enterprise SAML is opt-in. Set these in the Compose environment/root
      # .env (not backend/.env); see docs/deployment.md for provider setup.
      # GOTRUE_SAML_ENABLED: "true"
      # GOTRUE_SAML_PRIVATE_KEY: ${GOTRUE_SAML_PRIVATE_KEY:-}
      # GOTRUE_SAML_EXTERNAL_URL: ${AUTH_PUBLIC_URL:-http://localhost:54321}
      # Keep local signup frictionless by default. Set this to false to exercise
      # the confirmation-email flow; the message will be caught by Mailpit.
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-true}
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: "1025"
      # No SMTP_USER/PASS: Mailpit needs no auth, and GoTrue refuses to send
      # credentials over a plaintext (non-TLS) connection ("unencrypted connection").
      GOTRUE_SMTP_ADMIN_EMAIL: admin@mike.local
      GOTRUE_SMTP_SENDER_NAME: Mike
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9999/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # --- One-shot: load schema.sql once auth.users exists, then replay migrations.
  db-init:
    image: postgres:17.6
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      DB: postgres://postgres:postgres@db:5432/postgres
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./backend/schema.sql:/schema.sql:ro
      - ./backend/migrations:/migrations:ro
      - ./backend/scripts/migrate.sh:/migrate.sh:ro
      - ./docker/db-init/adopt-ledger.sh:/adopt-ledger.sh:ro
    entrypoint: ["bash", "-c"]
    command:
      - |
        # migrate.sh reads DATABASE_URL; deployments override only DB.
        export DATABASE_URL="$$DB";
        until psql "$$DB" -tAc "select to_regclass('auth.users')" | grep -q auth; do
          echo "waiting for auth schema..."; sleep 2;
        done
        if ! psql "$$DB" -tAc "select to_regclass('public.user_profiles')" | grep -q user_profiles; then
          # New volume: schema.sql is the complete schema, and it records every
          # migration it already contains in the ledger.
          psql "$$DB" -v ON_ERROR_STOP=1 -f /schema.sql || exit 1;
        elif ! psql "$$DB" -tAc "select to_regclass('public.schema_migrations')" | grep -q schema_migrations; then
          # Volume from before the ledger: replay one last time the way
          # db-init used to on every start, then record it.
          bash /adopt-ledger.sh || exit 1;
        fi
        # Apply the migrations the ledger does not list (backend/scripts/migrate.sh).
        bash /migrate.sh up || exit 1;
    restart: "no"

  # --- Local SMTP catcher. Auth emails land in its web inbox (no real sending).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      # Loopback only: the inbox exposes auth + password-reset links.
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025" # web inbox
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    restart: unless-stopped

  # --- S3-compatible object storage (RustFS, MinIO alternative).
  storage:
    image: rustfs/rustfs:latest
    ports:
      # Loopback only: creds below are the default admin pair.
      - "127.0.0.1:${STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-9001}:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    volumes:
      - storage_data:/data
    restart: unless-stopped

  createbucket:
    image: amazon/aws-cli
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./docker/storage-cors.json:/storage-cors.json:ro
    entrypoint: /bin/sh
    command: >
      -c "until aws --endpoint-url http://storage:9000 s3 ls; do echo 'waiting for storage'; sleep 2; done;
          aws --endpoint-url http://storage:9000 s3 mb s3://mike || true;
          aws --endpoint-url http://storage:9000 s3api put-bucket-cors --bucket mike --cors-configuration file:///storage-cors.json"
    restart: "no"

  # --- Redis: backs the BullMQ job queues (conversion, extraction, fast
  # delivery for background jobs). NEW INSTALLS get it out of the box, which
  # is why the backend below ships with the ASYNC_* flags on. Existing
  # deployments that upgrade in place are untouched: the flags only default
  # on here in compose, never in code, and without Redis configured the
  # backend falls back to its Postgres-backed queue automatically.
  # AOF persistence is on so queued jobs survive a Redis restart.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Loopback only — debugging convenience, never internet-reachable.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # --- One-shot: download, validate, and transactionally import mike-workflows.
  workflow-sync:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: mike-backend:local
    env_file:
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    environment:
      - AUTH_URL=http://auth:9999
      - AUTH_SERVICE_KEY=${AUTH_SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJtaWtlLWxvY2FsIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.uD8koYAMq_1hAlVmm1t5PYasyb98YME7G_UYVa5ME1Y}
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/postgres}
      - R2_ENDPOINT_URL=http://storage:9000
      - R2_ACCESS_KEY_ID=rustfsadmin
      - R2_SECRET_ACCESS_KEY=rustfsadmin
      - R2_BUCKET_NAME=mike
    command: ["npm", "run", "sync:workflows"]
    depends_on:
      db-init:
        condition: service_completed_successfully
      createbucket:
        condition: service_completed_successfully
    restart: "no"
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # Release tag for Sentry (docs/observability.md). A build arg, not a
        # runtime variable: the Dockerfile bakes it into the image.
        GIT_SHA: ${GIT_SHA:-}
    image: mike-backend:local
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    # ponytail: both optional — local dev keeps secrets in backend/.env, hosted
    # deploys (Dokploy et al) write them to the compose-root .env. Whichever
    # exists wins; root .env is last so it takes precedence. Needs Compose 2.24+.
    #
    # Secrets must NOT be listed in `environment:` below — that section overrides
    # env_file, so a bare name unset on the host blanks out the file's value.
    env_file:
      - path: ./backend/.env
        required: false
      - path: .env
        required: false
    environment:
      # Topology + local auth wiring (override .env placeholders).
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-development}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - API_PUBLIC_URL=${API_PUBLIC_URL:-http://localhost:3000/api}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - LLM_MAX_OUTPUT_TOKENS=${LLM_MAX_OUTPUT_TOKENS:-}
      # GoTrue, reached directly. OAuth sends the browser to the public URL.
      - AUTH_URL=http://auth:9999
      - AUTH_PUBLIC_URL=${AUTH_PUBLIC_URL:-http://localhost:54321}
      - AUTH_SERVICE_KEY=${AUTH_SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJtaWtlLWxvY2FsIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.uD8koYAMq_1hAlVmm1t5PYasyb98YME7G_UYVa5ME1Y}
      # Postgres: the app tables, with chat transcripts in the pi_durable
      # schema (Pi Durable) next to them.
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/postgres}
      - R2_ENDPOINT_URL=http://storage:9000
      - R2_PUBLIC_ENDPOINT_URL=${R2_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      - R2_ACCESS_KEY_ID=rustfsadmin
      - R2_SECRET_ACCESS_KEY=rustfsadmin
      - R2_BUCKET_NAME=mike
      # Local Ollama running on the host. Override OLLAMA_MODEL to change the tag.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      # Durable job queues: fresh compose installs run BullMQ-on-Redis for
      # everything (conversion + extraction async, instant delivery for
      # background jobs). Deployments without Redis fall back to the
      # Postgres queue; these flags are compose-level so in-place upgrades
      # of non-compose installs see no behavior change.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - ASYNC_DOCUMENT_CONVERSION=${ASYNC_DOCUMENT_CONVERSION:-true}
      - ASYNC_TABULAR_EXTRACTION=${ASYNC_TABULAR_EXTRACTION:-true}
      # Background workers run in a worker_thread inside this container by
      # default (off the HTTP event loop). To move them to their own
      # container/machine, set WORKERS_MODE=none here and enable the
      # `worker` service below.
      - WORKERS_MODE=${WORKERS_MODE:-thread}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      workflow-sync:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Optional: dedicated worker process ("async computer" mode).
  # Same image as the backend, different command: it runs ONLY the queue
  # workers and maintenance sweeps against the same Postgres/Redis. To use:
  # uncomment this service AND set WORKERS_MODE=none on the backend above so
  # background work runs exactly once. Scale-out is safe by construction —
  # BullMQ partitions per connection and the DB queue claims with
  # FOR UPDATE SKIP LOCKED, so replicas divide jobs, never duplicate them.
  # worker:
  #   build:
  #     context: .
  #     dockerfile: backend/Dockerfile
  #   command: ["node", "dist/worker.js"]
  #   env_file:
  #     - path: ./backend/.env
  #       required: false
  #     - path: .env
  #       required: false
  #   environment:
  #     - AUTH_URL=http://auth:9999
  #     - AUTH_SERVICE_KEY=${AUTH_SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJtaWtlLWxvY2FsIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.uD8koYAMq_1hAlVmm1t5PYasyb98YME7G_UYVa5ME1Y}
  #     - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/postgres}
  #     - R2_ENDPOINT_URL=http://storage:9000
  #     - R2_ACCESS_KEY_ID=rustfsadmin
  #     - R2_SECRET_ACCESS_KEY=rustfsadmin
  #     - R2_BUCKET_NAME=mike
  #     - REDIS_URL=${REDIS_URL:-redis://redis:6379}
  #     - ASYNC_DOCUMENT_CONVERSION=${ASYNC_DOCUMENT_CONVERSION:-true}
  #     - ASYNC_TABULAR_EXTRACTION=${ASYNC_TABULAR_EXTRACTION:-true}
  #   depends_on:
  #     db-init:
  #       condition: service_completed_successfully
  #     redis:
  #       condition: service_healthy
  #   restart: unless-stopped

  frontend:
    build:
      # Repo-root context: the frontend's shared types import type-only
      # definitions from backend/src (see frontend/Dockerfile).
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # The browser-side Sentry DSN is inlined by `next build`, so it is a
        # build argument, not a runtime variable (docs/observability.md).
        NEXT_PUBLIC_SENTRY_DSN: ${FRONTEND_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
        NEXT_PUBLIC_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
        # Opt-out and install kind reach the browser bundle at build time.
        NEXT_PUBLIC_SENTRY_DISABLED: ${SENTRY_DISABLED:-}
        NEXT_PUBLIC_SENTRY_INSTALL: ${SENTRY_INSTALL:-}
        GIT_SHA: ${GIT_SHA:-}
    environment:
      - API_BASE_URL=${API_BASE_URL:-http://backend:3001}
      # Next server side (the /api gateway); same project as the browser.
      - SENTRY_DISABLED=${SENTRY_DISABLED:-}
      - SENTRY_INSTALL=${SENTRY_INSTALL:-}
      - SENTRY_DSN=${FRONTEND_SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    ports:
      # Dokploy's own dashboard occupies 3000 — set FRONTEND_PORT there.
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  storage_data:
  redis_data:
