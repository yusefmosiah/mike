<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mike</title>
    <style>
      :root { color-scheme: light dark; --bg: #f9fafb; --fg: #111827; --muted: #6b7280; --accent: #0088ff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111214; --fg: #f3f4f6; --muted: #9ca3af; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
      main { max-width: 360px; text-align: center; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 20px; }
      button { font: inherit; color: #fff; background: var(--accent); border: 0; border-radius: 999px; padding: 10px 22px; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Mike can't be reached</h1>
      <p>Check your connection (and the firm VPN, if you use one), then try again.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script src="server.js"></script>
    <script>
      document.getElementById("retry").addEventListener("click", () => {
        location.replace(window.MIKE_SERVER_URL || "/");
      });
    </script>
  </body>
</html>
