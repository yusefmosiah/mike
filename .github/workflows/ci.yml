# CI: the checks that gate the staging deploy.
#
# A green run on main is what deploys (deploy-staging.yml runs on this
# workflow's completion), so this workflow holds the core product's checks and
# nothing that fails for reasons outside this repository. Inherited features
# not in active use (the Word add-in, Google Workspace, tabular reviews), the
# browser suites and the security scans run on a schedule instead
# (nightly.yml, security.yml, codeql.yml, scorecard.yml); see docs/ci.md.
#
# The jobs run side by side, so the run takes as long as the slowest one, and
# the quick checks (types, lint) report in about a minute instead of after the
# test suites. `npm run verify` runs the same commands locally.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Documentation alone changes nothing that runs, so it neither tests nor
    # deploys; the next code change deploys it.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # Include stacked PRs whose base is another feature branch.
  pull_request:

# Don't pile up runs on rapid pushes to the same PR: a new push cancels the
# superseded run so it stops holding job slots (the org's concurrent-job cap is
# shared by every workflow). Pushes to main each get their own group (keyed by
# sha) and are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Git's line-level merge can splice both sides of package(-lock).json
      # into invalid JSON without a conflict (bit PR #233). npm's own error
      # for an unparseable lockfile is the misleading "npm ci can only
      # install with an existing package-lock.json" — fail fast with the real
      # reason instead.
      - name: Validate package.json and lockfile parse
        run: node -e "for (const f of ['package.json','package-lock.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"

      - run: npm ci

      # `npm run build` (tsc -p tsconfig.json) deliberately excludes the test
      # files so they never reach dist/, which left them entirely unchecked.
      # tsconfig.test.json re-includes them with noEmit, so a stale mock
      # signature fails here instead of silently passing at runtime.
      - run: npm run typecheck:test

      - run: npm run typecheck:contracts

      - run: npm run build

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # The suite with the coverage floors from vitest.config.mts: a coverage
      # drop fails CI. Judge it by its exit code: every test can pass and a
      # floor still fail.
      - run: npm run test:coverage

  frontend-checks:
    name: Frontend types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Same silent-merge-corruption guard as the backend job.
      - name: Validate package.json and lockfile parse
        run: node -e "for (const f of ['package.json','package-lock.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"

      - run: npm ci

      # Type-checks the whole program, tests included. `next build` checks
      # only tsconfig.build.json, which excludes test files so the production
      # image never depends on fixtures outside frontend/ (see
      # frontend/src/__tests__/architecture.test.ts). Vitest strips types
      # without checking them, so this step is the only gate on test type
      # errors.
      - run: npm run typecheck

      # Errors fail the step; warnings do not.
      - run: npm run lint

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The suite with the coverage floors (see docs/frontend-testing.md).
      # Judge it by its exit code: every test can pass and a floor still fail.
      - run: npm run test:coverage

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Next's incremental build cache: unchanged modules are not recompiled.
      - uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('frontend/package-lock.json') }}-

      # Production build. Runtime-only server configuration is intentionally
      # not required for this compile-time check. Catches type errors (next
      # build runs tsc) and broken routes and imports.
      - run: npm run build

      # Bundles every web and cross-target UI story: catches broken story
      # imports and Ladle configuration.
      - run: npm run catalog:build

  # Playwright strips types without checking them, and the browser suite
  # itself runs only nightly and on pull requests, so a broken spec would sit
  # on main unseen (one did, after a half-finished edit) without this check.
  e2e-types:
    name: Browser spec types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run typecheck:e2e

  # The images a fresh install builds. A file reaching outside an image's
  # build context only fails here (see docker-images.yml), and that shipped to
  # main three times before this check existed, so it gates the deploy too.
  docker-images:
    name: Docker images
    uses: ./.github/workflows/docker-images.yml
