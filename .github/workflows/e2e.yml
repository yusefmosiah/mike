# End-to-end Playwright suite (auth, chat, projects, tabular reviews, workflows).
#
# This workflow is what makes the e2e suite a MERGE GATE: it runs on every pull
# request into a protected branch, boots a full local stack (Postgres + GoTrue +
# backend API + Next.js web + RustFS object storage), runs Playwright, and fails the check
# when any spec fails. To have a red run actually BLOCK a merge you must also mark
# this job "e2e / playwright" as a required status check in branch protection —
# see docs/e2e-ci.md ("Make it merge-blocking").
#
# The suite is green with NO secret: the four live-LLM-dependent cases
# (chat + critical path) skip themselves when ANTHROPIC_API_KEY is absent (see
# e2e/llm.ts), while all keyless cases still run. Mike supports local
# Ollama models without a provider key, but this job does not provision Ollama;
# the gate is not caused by the best-effort title-generation call. To run and
# enforce those 4, set the ANTHROPIC_API_KEY repository secret; exact steps, the
# fork-PR caveat (fork `pull_request` runs never receive secrets, so they
# always take the skip path), cost, and how to verify the specs ran are in
# docs/e2e-ci.md ("Enable the LLM specs").
#
# Each worker creates its own account through e2e/fixtures.ts and e2e/users.ts.
# auth.setup.ts creates only the isolated logout account. No login secret is needed.
name: e2e

on:
  workflow_dispatch:
  # Include stacked PRs whose base is another feature branch.
  pull_request:
  # Nightly run against the default branch, so drift that lands BETWEEN pull
  # requests (a dependency bump, an image change, an upstream UI tweak
  # breaking a selector) is caught within a day instead of surfacing on the next
  # unrelated PR. 03:47 UTC is a quiet hour for GitHub's cron pool (on-the-hour
  # slots are congested and can be delayed or dropped). Scheduled runs exercise
  # the 4 LLM-gated specs only when the ANTHROPIC_API_KEY repository secret is
  # configured — without it they self-skip (e2e/llm.ts) and the run still
  # covers the other specs.
  schedule:
    - cron: "47 3 * * *"

# Don't pile up runs on rapid pushes to the same PR.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Development stress (the `next dev` renderer) is 3-4x slower than the
# production suite — ~25-35 min against ~7 — and was the last check to finish
# on every slow PR. It runs nightly, on manual dispatch, and on any PR carrying
# the `stress` label; ordinary PR pushes run only the production suite. Add the
# label to PRs that touch streaming, render loops or effect dependencies; it
# takes effect on the next push (or close + reopen the PR). There is deliberately
# no `labeled` trigger: a run started by an unrelated label would report every
# check as skipped, and a skipped check counts as passing — masking a red run.

jobs:
  synthetic:
    # The Playwright `synthetic` project (assistant-streaming and
    # tabular-chat-lifecycle) mocks every /api call inside the browser, so it
    # needs only the web app: no database, backend or account. Running it here
    # keeps the full-stack job short. The streaming tests are slow by design
    # (4x CPU throttling, hundreds of SSE chunks; up to ~2 min each), and share
    # nothing. Four of them on one 4-vCPU runner slowed each other ~2.5x
    # (120 s -> 300 s), so they are split across runners by chat scope: the
    # assistant and project pairs (~2-3 min each) get a runner each, and
    # `rest` takes every other synthetic test, so a new test is never dropped.
    # The production renderer runs on every PR; the development renderer,
    # which alone surfaces React's passive-update-depth warning, is a stress
    # job (see above).
    name: Assistant streaming (${{ matrix.renderer }}, ${{ matrix.group }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        renderer: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'stress')) && '["production","development"]' || '["production"]') }}
        group: [assistant, project, rest]
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      SENTRY_DISABLED: "true"
      NEXT_PUBLIC_SENTRY_DISABLED: "true"
      E2E_WORKERS: "2"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - name: Ensure lightningcss native binary
        run: npm install --no-save lightningcss --prefix frontend
      - run: npx playwright install --with-deps chromium
      - name: Build web (production)
        if: matrix.renderer == 'production'
        run: npm run build --prefix frontend
      - name: Test paced streaming
        run: |
          if [ "${{ matrix.renderer }}" = "development" ]; then
            npm run dev --prefix frontend -- --hostname 127.0.0.1 > /tmp/assistant-streaming-next.log 2>&1 &
          else
            npm run start --prefix frontend -- --hostname 127.0.0.1 > /tmp/assistant-streaming-next.log 2>&1 &
          fi
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 10 "$PLAYWRIGHT_BASE_URL/assistant/chat/streaming-regression" > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat /tmp/assistant-streaming-next.log
            exit 1
          fi
          # Development stress keeps zero retries so an intermittent loop
          # cannot pass on a retry; production uses the config's CI retries.
          case "${{ matrix.group }}" in
            assistant) filter=(--grep "long assistant conversations") ;;
            project) filter=(--grep "long project conversations") ;;
            rest) filter=(--grep-invert "long (assistant|project) conversations") ;;
          esac
          npx playwright test --project=synthetic "${filter[@]}" \
            ${{ matrix.renderer == 'development' && '--retries=0 --trace=retain-on-failure' || '' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: assistant-streaming-${{ matrix.renderer }}-${{ matrix.group }}
          path: |
            playwright-report/
            test-results/
            /tmp/assistant-streaming-next.log
          retention-days: 14
          if-no-files-found: ignore

  playwright:
    name: ${{ matrix.renderer == 'production' && 'playwright' || 'Playwright (development stress)' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The development leg only exists when stress is opted in (see above).
        renderer: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'stress')) && '["production","development"]' || '["production"]') }}
    runs-on: ubuntu-latest
    env:
      # Login credentials come from e2e/users.ts; pin only the browser origin.
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      REACT_STRESS: ${{ matrix.renderer == 'development' && '1' || '0' }}
      # Parallel Playwright workers, each with its own account (e2e/users.ts).
      # The runner has 4 vCPUs shared with Postgres, the API and Next.
      E2E_WORKERS: "3"
      # Exposed to the Playwright process (not just backend/.env) so the LLM-gated
      # specs can skip themselves when no key is present — see e2e/llm.ts. When the
      # secret is set they run and are enforced; when absent they skip, so a keyless
      # run (e.g. a fork PR, which never receives this secret) is still green on
      # all other cases. Setup: docs/e2e-ci.md, "Enable the LLM specs".
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      # Three installs: the root package (Playwright + the e2e tooling), the
      # backend API, and the Next.js web app. Each carries its own lockfile in
      # this repo's backend/ + frontend/ layout (no root workspace).
      - name: Install root (Playwright) deps
        run: npm ci
      - name: Install backend deps
        run: npm ci --prefix backend
      - name: Install frontend deps
        run: npm ci --prefix frontend

      # npm ci intermittently skips lightningcss's Linux native optional dep
      # (npm/cli#4828); without it `next dev` can't compile Tailwind CSS and the
      # web server never boots, so wait-on times out and every spec fails.
      - name: Ensure lightningcss native binary
        run: npm install --no-save lightningcss --prefix frontend

      # Playwright transpiles TypeScript without typechecking. Keep missing
      # helpers and stale fixture signatures from hiding in gated browser flows.
      - name: Typecheck browser specs
        run: >-
          npx tsc --ignoreConfig --noEmit --module nodenext
          --moduleResolution nodenext --target es2022 --skipLibCheck
          --esModuleInterop --types node e2e/*.ts playwright.config.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Object storage. Three specs upload a document (tabular-review row,
      # project-folder fixture) and assert the result renders; those uploads go
      # through backend/src/lib/storage.ts, an S3-compatible client that only
      # ENABLES when R2_ENDPOINT_URL + R2_ACCESS_KEY_ID + R2_SECRET_ACCESS_KEY are
      # set (region "auto", forcePathStyle true — S3-compatible as written).
      # With no storage the upload endpoint 5xxs and the row never appears. A
      # A `docker run` (not a `services:` container) keeps storage startup and
      # bucket creation together after the server is healthy.
      - name: Start RustFS (object storage)
        run: |
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_VOLUMES=/data \
            -e RUSTFS_ADDRESS=0.0.0.0:9000 \
            -e RUSTFS_CONSOLE_ENABLE=false \
            -e RUSTFS_ACCESS_KEY=rustfsadmin \
            -e RUSTFS_SECRET_KEY=rustfsadmin \
            rustfs/rustfs:latest
          for i in $(seq 1 30); do
            if AWS_ACCESS_KEY_ID=rustfsadmin \
               AWS_SECRET_ACCESS_KEY=rustfsadmin \
               AWS_DEFAULT_REGION=us-east-1 \
                 aws --endpoint-url http://localhost:9000 s3 ls >/dev/null 2>&1; then
              echo "RustFS ready"; break
            fi
            echo "waiting for RustFS ($i)…"; sleep 2
          done
          AWS_ACCESS_KEY_ID=rustfsadmin \
          AWS_SECRET_ACCESS_KEY=rustfsadmin \
          AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://localhost:9000 s3 mb s3://mike
          # CI must exercise the SAME bucket CORS policy that docker-compose and
          # the production runbook install (docker/storage-cors.json). A change
          # that adds a request header to the storage PUT must fail CI
          # if the deployed CORS policy does not allow it.
          AWS_ACCESS_KEY_ID=rustfsadmin \
          AWS_SECRET_ACCESS_KEY=rustfsadmin \
          AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://localhost:9000 s3api put-bucket-cors \
              --bucket mike --cors-configuration file://docker/storage-cors.json
          AWS_ACCESS_KEY_ID=rustfsadmin \
          AWS_SECRET_ACCESS_KEY=rustfsadmin \
          AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://localhost:9000 s3api get-bucket-cors --bucket mike
          AWS_ACCESS_KEY_ID=rustfsadmin \
          AWS_SECRET_ACCESS_KEY=rustfsadmin \
          AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://localhost:9000 s3 ls s3://mike

      # Postgres + GoTrue from docker-compose.yml (the images the product
      # ships), then the repository's own fresh-database schema — exactly what
      # a new install runs (backend/schema.sql). Low dedicated ports avoid
      # intermittent collisions with runner outbound traffic in Linux's
      # ephemeral range.
      - name: Start Postgres and GoTrue, load fresh schema
        run: |
          DB_PORT=21322 AUTH_PORT=21321 MAILPIT_PORT=21325 MAILPIT_SMTP_PORT=21326 \
          AUTH_PUBLIC_URL=http://localhost:21321 \
            docker compose -p mike-e2e up -d --wait db auth
          # A fresh database runs the current schema exactly once. Historical
          # migrations only upgrade older deployments; replaying them on top of
          # schema.sql can overwrite current functions with obsolete definitions.
          # The schema-drift workflow separately proves that the real upgrade path
          # (pinned baseline + migrations) converges with this fresh-install path.
          psql "postgres://postgres:postgres@127.0.0.1:21322/postgres" -v ON_ERROR_STOP=1 -f backend/schema.sql

      # The web client talks to its own /api gateway. Only the Next server
      # needs the upstream backend origin. Written before the build because
      # Next inlines NEXT_PUBLIC_* values at build time.
      - name: Write web env
        run: |
          {
            echo "API_BASE_URL=http://localhost:3001"
            echo "SENTRY_DISABLED=true"
            echo "NEXT_PUBLIC_SENTRY_DISABLED=true"
          } > frontend/.env.local

      - name: Build backend
        run: npm run build --prefix backend

      # Keep release-build coverage alongside development diagnostics. The dev
      # job warms routes below so on-demand compilation does not consume UI
      # assertion budgets; its error overlay deliberately remains observable.
      - name: Build web (production)
        if: matrix.renderer == 'production'
        run: npm run build --prefix frontend

      - name: Wire backend env
        run: |
          # The compose file's local demo service-role key, signed with its GoTrue secret.
          SERVICE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJtaWtlLWxvY2FsIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.uD8koYAMq_1hAlVmm1t5PYasyb98YME7G_UYVa5ME1Y
          # dotenv is last-wins: start from the committed example (so any key we
          # don't override keeps a sane placeholder) then append the real values.
          cp backend/.env.example backend/.env
          {
            echo "PORT=3001"
            echo "FRONTEND_URL=http://localhost:3000"
            echo "API_PUBLIC_URL=http://localhost:3000/api"
            echo "AUTH_URL=http://localhost:21321"
            echo "AUTH_SERVICE_KEY=$SERVICE_KEY"
            echo "DATABASE_URL=postgres://postgres:postgres@127.0.0.1:21322/postgres"
            # Both secrets are consumed lazily by download-token signing and API-key
            # encryption; supply CI dummies well over any length floor.
            echo "DOWNLOAD_SIGNING_SECRET=ci-download-signing-secret-0123456789abcdef"
            echo "USER_API_KEYS_ENCRYPTION_SECRET=ci-user-api-keys-encryption-secret-0123456789abcdef"
            # The suite drives many writes back-to-back (create folder/workflow/
            # review, upload, update profile, login); the default per-window caps
            # trip 429s that surface as flaky timeouts. e2e isn't testing
            # throttling, so raise every tunable cap above one serial run's needs.
            echo "RATE_LIMIT_GENERAL_MAX=100000"
            echo "RATE_LIMIT_CHAT_MAX=100000"
            echo "RATE_LIMIT_CHAT_CREATE_MAX=100000"
            echo "RATE_LIMIT_UPLOAD_MAX=100000"
            echo "RATE_LIMIT_EXPORT_MAX=100000"
            echo "RATE_LIMIT_DATA_DELETE_MAX=100000"
            echo "RATE_LIMIT_UPLOAD_SESSION_MUTATION_MAX=100000"
            echo "RATE_LIMIT_UPLOAD_SESSION_POLL_MAX=100000"
            echo "RATE_LIMIT_UPLOAD_SESSION_CREATE_MAX_PER_HOUR=100000"
            echo "RATE_LIMIT_AUTH_LOGIN_MAX=100000"
            echo "RATE_LIMIT_AUTH_ACCOUNT_MAX=100000"
            echo "RATE_LIMIT_AUTH_EMAIL_MAX=100000"
            echo "RATE_LIMIT_AUTH_FLOW_MAX=100000"
            echo "RATE_LIMIT_AUTH_MFA_MAX=100000"
            # Point the S3-compatible storage adapter at the RustFS container above.
            echo "R2_ENDPOINT_URL=http://localhost:9000"
            echo "R2_ACCESS_KEY_ID=rustfsadmin"
            echo "R2_SECRET_ACCESS_KEY=rustfsadmin"
            echo "R2_BUCKET_NAME=mike"
            # Keep the release-job fixture reproducible even when the source
            # repository's main branch changes independently of this PR.
            echo "MIKE_WORKFLOWS_REF=ce62e6a2d3f47e1d3567a4f2edc61898cfe9e78a"
            echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"
            # Error reporting is on by default; CI runs must not report.
            echo "SENTRY_DISABLED=true"
          } >> backend/.env

      # Production runs this as a release job after migrations and before the
      # backend starts. E2E must exercise the same ordering so defaults exist.
      - name: Sync Mike workflow catalog
        run: npm run sync:workflows --prefix backend

      - name: Start backend API
        run: npm run dev --prefix backend &
      - name: Start web
        run: |
          if [ "${{ matrix.renderer }}" = "development" ]; then
            npm run dev --prefix frontend > /tmp/e2e-next.log 2>&1 &
          else
            npm run start --prefix frontend > /tmp/e2e-next.log 2>&1 &
          fi

      - name: Wait for servers
        run: npx wait-on http://localhost:3001/health http://localhost:3000 --timeout 120000

      # Precompile static routes so cold Turbopack work does not consume UI
      # assertion budgets. Development overlays remain visible to the tests.
      # Onboarding and dynamic routes are warmed too: with parallel workers on
      # a throttled CPU, a route's first `next dev` compile overran a 15 s
      # navigation wait (/projects/[id] in one run; /onboarding/profile while
      # three workers signed in at once in another), and stress runs have zero
      # retries. A placeholder id is enough to compile a dynamic route; its
      # status code doesn't matter here.
      - name: Warm development routes
        if: matrix.renderer == 'development'
        run: |
          for route in login onboarding/profile onboarding/practice assistant projects tabular-reviews workflows settings; do
            curl --fail --silent --max-time 120 "http://localhost:3000/$route" > /dev/null
          done
          for route in assistant/chat/warm projects/warm projects/warm/assistant/chat/warm \
            projects/warm/folders/warm projects/warm/tabular-reviews/warm tabular-reviews/warm \
            workflows/assistant/warm workflows/tabular-review/warm; do
            curl --silent --max-time 180 --output /dev/null "http://localhost:3000/$route" &
          done
          wait

      # playwright.config.ts sets webServer to undefined when CI=true, so the job
      # is responsible for the servers above; Playwright just drives them.
      # `chromium` is every full-stack spec (plus its `setup` dependency); the
      # mocked-API specs run in the `synthetic` job above. E2E_WORKERS (job env)
      # sets the parallel workers, each signed in as its own user.
      - name: Run Playwright
        run: npx playwright test --project=chromium

      # always() (not !cancelled()) so the report still uploads when the job is
      # cancelled by the timeout — that's exactly when you most need the traces.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.renderer }}
          path: |
            playwright-report/
            test-results/
            /tmp/e2e-next.log
          retention-days: 14
          if-no-files-found: ignore
