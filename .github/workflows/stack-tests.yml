# CI: stack integration tests.
#
# Runs the gated stack-level suite (backend/src/__tests__/integration/
# *.stack.test.ts) against a REAL Postgres and GoTrue booted on the runner
# from docker-compose.yml. On every PR this proves two things mocks cannot:
# the deny-all RLS firewall actually holds for the anon and authenticated
# roles, and the auth↔API contract (sign-in, JWT verification, service-role
# access) still works against the real services. The job runs
# backend/scripts/test-stack.sh, the same script a developer runs locally;
# the suite itself self-skips without its env vars, which is why the plain
# CI workflow never exercises it.
#
# Everything runs locally on the runner: no secrets, no external services.
# The keys used are the compose file's well-known local demo values.
name: Stack tests

on:
  push:
    branches: [main]
  # Include stacked PRs whose base is another feature branch.
  pull_request:
  workflow_dispatch:

# Booting the stack is one of the slower jobs in the repo, so cancel runs
# that a newer push to the same PR has superseded. Pushes to main each get
# their own group (keyed by sha) and are never cancelled.
concurrency:
  group: stack-tests-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  stack:
    # The check's name predates the move off Supabase; branch protection may
    # require it by this name, so rename it only together with that rule.
    name: Supabase stack integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Starts Postgres + GoTrue from docker-compose.yml (pinned images: bump
      # them deliberately, and this is the harness you re-run when you do),
      # loads backend/schema.sql into the empty database, and runs the suite.
      # schema.sql is the complete, up-to-date shape for fresh databases
      # (backend/migrations/ exists only to move OLDER deployments forward and
      # is deliberately not applied here — replaying history on top of the
      # current schema is not a real installation path).
      - name: Run stack integration tests
        run: bash backend/scripts/test-stack.sh
